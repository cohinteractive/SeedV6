plugins {
    id 'base'
}

apply from: rootProject.file('gradle/project-boundaries.gradle')
apply from: rootProject.file('gradle/integration.gradle')

tasks.named('check') {
    dependsOn subprojects.collect { "${it.path}:check" }
}
tasks.named('assemble') {
    dependsOn subprojects.collect { "${it.path}:assemble" }
}

// Retained legacy snapshots; unified candidates are independent of :app.
apply from: rootProject.file('gradle/package-mac.gradle')

tasks.register('packageLegacyWindows', Exec) {
    group = 'distribution'
    description = 'Builds a standalone Windows GUI executable with a bundled Java runtime, without running tests.'

    dependsOn ':app:installDist'
    workingDir rootProject.projectDir
    commandLine 'powershell.exe', '-NoProfile', '-File',
            rootProject.file('tools/package-windows.ps1').absolutePath, '-FromGradle'
    // No declared outputs: each invocation creates a new timestamped snapshot.
}

apply from: rootProject.file('gradle/native-packaging.gradle')
