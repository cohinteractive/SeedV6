plugins {
    id 'java-library'
}
apply from: rootProject.file('gradle/java-conventions.gradle')
// Headless runtime identity is shared by GUI About and UCI diagnostics.
apply from: rootProject.file('gradle/application-version.gradle')

description = 'Shared production board, rules, search, evaluation and runtime model inference.'

// Compile the lazily loaded optional NNUE kernel; ordinary runtime needs no module flag.
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['--add-modules', 'jdk.incubator.vector'] }
tasks.withType(Test).configureEach {
    if (project.hasProperty('conventionalVectorTests')) jvmArgs '--add-modules=jdk.incubator.vector'
}

apply from: rootProject.file('gradle/syzygy.gradle')

// Tracked, checksum-verified runtime inputs for explicit pinned gameplay profiles.
tasks.named('processResources') {
    from(rootProject.file('build-assets/production/bre-pair2-g32.brn-pair2')) { into 'models' }
    from(rootProject.file('build-assets/nnue-candidate/conventional-cp64.cnnue')) { into 'models' }
}

tasks.withType(Test).configureEach {
    if (project.hasProperty('headless')) systemProperty 'java.awt.headless', 'true'
    maxHeapSize = '2g'
}
