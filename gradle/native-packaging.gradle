import org.gradle.process.ExecOperations
import javax.inject.Inject
import java.nio.channels.FileChannel
import java.nio.channels.FileLock
import java.nio.file.StandardOpenOption
import org.gradle.api.services.BuildService
import org.gradle.api.services.BuildServiceParameters

// Held from preflight through build completion, including compilation and compare.
// A second Gradle process must not replace the shared context or compiler outputs.
abstract class NativePackagingLock implements BuildService<NativePackagingLock.Parameters>, AutoCloseable {
    interface Parameters extends BuildServiceParameters {
        RegularFileProperty getLockFile()
    }
    private FileChannel channel
    private FileLock lock
    synchronized void acquire() {
        if (lock != null) return
        def file = parameters.lockFile.get().asFile
        file.parentFile.mkdirs()
        channel = FileChannel.open(file.toPath(), StandardOpenOption.CREATE, StandardOpenOption.WRITE)
        lock = channel.tryLock()
        if (lock == null) {
            channel.close()
            channel = null
            throw new GradleException('Another native packaging build is active. Wait for it to finish and retry.')
        }
    }
    synchronized void close() {
        if (lock != null) lock.release()
        if (channel != null) channel.close()
        lock = null
        channel = null
    }
}

// One convention, two application owners. Python uses only its standard library;
// native assembly remains JDK jpackage/jlink. No root runtime configuration.
abstract class NativePackaging extends DefaultTask {
    @Input abstract Property<String> getAction()
    @Input abstract Property<String> getPlatformName()
    @Input abstract Property<String> getApplicationId()
    @Input abstract Property<String> getCandidateId()
    @Input abstract Property<Boolean> getKeepStaging()
    @Internal abstract Property<NativePackagingLock> getPackagingLock()
    @Input abstract Property<String> getPythonCommand()
    @Input abstract Property<String> getModelPath()
    @Internal abstract DirectoryProperty getRepositoryDirectory()
    @Input abstract Property<String> getJdkPath()
    @Input abstract Property<String> getGradleJdkPath()
    @Input abstract Property<String> getJdkInstallationPaths()
    @Internal abstract DirectoryProperty getCompilerHome()
    @Internal abstract RegularFileProperty getContextFile()
    @Classpath abstract ConfigurableFileCollection getRuntimeJars()
    @Inject abstract ExecOperations getExecOperations()

    @TaskAction void executePackaging() {
        packagingLock.get().acquire()
        def command = [pythonCommand.get(), '-B',
            new File(repositoryDirectory.get().asFile, 'tools/native_packaging.py').absolutePath,
            action.get(), '--platform', platformName.get(), '--context', contextFile.get().asFile.absolutePath]
        if (action.get() == 'prepare') {
            command += ['--jdk', jdkPath.get(), '--gradle-jdk', gradleJdkPath.get(),
                        '--jdk-installation-paths', jdkInstallationPaths.get(), '--model', modelPath.get(),
                        '--candidate', candidateId.get()]
        } else if (action.get() == 'package') {
            command += ['--application', applicationId.get(), '--compiler-jdk', compilerHome.get().asFile.absolutePath]
            if (keepStaging.get()) command += ['--keep-staging']
            runtimeJars.files.sort { it.name }.each { command += ['--jar', it.absolutePath] }
        }
        execOperations.exec {
            workingDir repositoryDirectory.get().asFile
            commandLine command
        }
    }
}

def python = providers.gradleProperty('packagingPython').orElse(
        System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'python' : 'python3')
def packagingLockService = gradle.sharedServices.registerIfAbsent('nativePackagingLock', NativePackagingLock) {
    parameters.lockFile = rootProject.layout.buildDirectory.file('packaging/native-packaging.lock')
}
def model = providers.gradleProperty('productionModel').orElse(
        providers.environmentVariable('SEEDV6_PRODUCTION_MODEL')).orElse(
        rootProject.file('build-assets/production/bre-pair2-g32.brn-pair2').absolutePath)

// Optional machine-specific native tools; do not change Gradle's daemon/compiler JDK.
// Provider-backed reads invalidate the configuration cache when this file changes.
def localPackaging = new Properties()
localPackaging.load(new StringReader(providers.fileContents(
        rootProject.layout.projectDirectory.file('build-assets/packaging.properties')).asText.orElse('').get()))
['Windows': 'windows', 'Mac': 'macos'].each { suffix, platform ->
    def jdkKey = platform == 'windows' ? 'windowsPackagingJdk' : 'macPackagingJdk'
    // All explicit Gradle selections precede local file settings. Empty means
    // discover at task execution, so newly installed JDKs work with cache replay.
    def packagingJdk = providers.gradleProperty(jdkKey).orElse(providers.gradleProperty('packagingJdk')).orElse(
            localPackaging.getProperty(jdkKey, localPackaging.getProperty('packagingJdk', '')))
    def configuredJdk = packagingJdk.get()
    def context = rootProject.layout.buildDirectory.file("packaging/context-${platform}.json")
    def common = { NativePackaging t ->
        t.platformName = platform
        t.repositoryDirectory = rootProject.layout.projectDirectory
        t.jdkPath = configuredJdk ? rootProject.file(configuredJdk).absolutePath : ''
        t.gradleJdkPath = System.getProperty('java.home')
        t.jdkInstallationPaths = providers.gradleProperty('org.gradle.java.installations.paths').orElse('')
        t.pythonCommand = python
        t.modelPath = model
        t.candidateId = providers.gradleProperty('candidateId').orElse('current')
        t.keepStaging = providers.gradleProperty('keepPackagingStaging').map { it.toBoolean() }.orElse(false)
        t.packagingLock = packagingLockService
        t.usesService(packagingLockService)
        t.applicationId = ''
        t.contextFile = context
        // Always perform a fresh native build/verification; never reuse a success marker.
        t.outputs.upToDateWhen { false }
    }
    def preflight = tasks.register("prepare${suffix}Packaging", NativePackaging) {
        common(it)
        action = 'prepare'
        group = 'distribution'
        description = "Discovers compatible installed ${platform} JDK tools and validates the production model."
    }
    // A wrong-platform request fails before Java/native compilation, not after it.
    allprojects { owner ->
        owner.tasks.configureEach { task ->
            if (task.name in ['compileJava', 'processResources', 'jar', 'compileSyzygy', 'generateApplicationVersion'])
                task.mustRunAfter(preflight)
        }
    }
    ['gui', 'uci'].each { app ->
        project(":app-${app}") { owner ->
            plugins.withId('java') {
                tasks.register("package${suffix}", NativePackaging) {
                    common(it)
                    action = 'package'
                    applicationId = app
                    compilerHome = javaToolchains.compilerFor(java.toolchain).map { it.metadata.installationPath }
                    group = 'distribution'
                    description = "Replaces the current ${platform} ${app} image and ZIP; candidateId explicitly freezes a separate build."
                    dependsOn preflight, tasks.named('jar')
                    runtimeJars.from(tasks.named('jar'), configurations.runtimeClasspath)
                }
            }
        }
    }
    tasks.register("package${suffix}", NativePackaging) {
        common(it)
        action = 'compare'
        group = 'distribution'
        description = "Builds BOTH current ${platform} distributions and verifies their common engine identity."
        dependsOn ":app-gui:package${suffix}", ":app-uci:package${suffix}"
    }
}
