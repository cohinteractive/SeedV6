plugins {
    id 'java'
    id 'distribution'
}
apply from: rootProject.file('gradle/java-conventions.gradle')

description = 'Standalone headless UCI application using the authoritative engine-core.'
dependencies {
    implementation project(':engine-core')
}

// A uniquely named task preserves the established unqualified legacy `run --args=gui` route.
tasks.register('runUci', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.uci.UciMain'
    jvmArgs '-Djava.awt.headless=true', '-Xmx768m'
    standardInput = System.in
}
tasks.register('startScripts', CreateStartScripts) {
    applicationName = 'seedv6-uci'
    mainClass = 'com.ohinteractive.seedv6.uci.UciMain'
    defaultJvmOpts = ['-Djava.awt.headless=true', '-Xmx768m']
    outputDir = layout.buildDirectory.dir('scripts').get().asFile
    classpath = files(tasks.named('jar'), configurations.runtimeClasspath)
    doLast {
        windowsScript.text = windowsScript.text.replace('@if "%DEBUG%"=="" @echo off', '@echo off')
    }
}
distributions {
    main {
        distributionBaseName = 'seedv6-uci'
        contents {
            into('lib') { from tasks.named('jar'); from configurations.runtimeClasspath }
            into('bin') { from tasks.named('startScripts'); filePermissions { unix('rwxr-xr-x') } }
        }
    }
}
tasks.named('assemble') { dependsOn tasks.named('distZip'), tasks.named('distTar') }

tasks.register('constructionStartScripts', CreateStartScripts) {
    applicationName = 'seedv6-construction-v1'
    mainClass = 'com.ohinteractive.seedv6.uci.ConstructionUciMain'
    defaultJvmOpts = ['-Djava.awt.headless=true', '-Xmx768m']
    outputDir = layout.buildDirectory.dir('constructionScripts').get().asFile
    classpath = files(tasks.named('jar'), configurations.runtimeClasspath)
    doLast {
        windowsScript.text = windowsScript.text.replace('@if "%DEBUG%"=="" @echo off', '@echo off')
    }
}
distributions {
    construction {
        distributionBaseName = 'seedv6-construction-v1'
        contents {
            into('lib') { from tasks.named('jar'); from configurations.runtimeClasspath }
            into('bin') { from tasks.named('constructionStartScripts'); filePermissions { unix('rwxr-xr-x') } }
        }
    }
}
tasks.withType(Test).configureEach {
    systemProperty 'java.awt.headless', 'true'
    maxHeapSize = '768m'
}

// An explicit release candidate, independent of both standard Gen32 and construction-v1.
tasks.named('processResources') {
    from(rootProject.file('build-assets/nnue-candidate/conventional-cp64.cnnue')) { into 'models' }
}
distributions {
    nnueCandidate {
        distributionBaseName = 'seedv6-nnue-cp64-e008-rc1'
        contents {
            into('lib') { from tasks.named('jar'); from configurations.runtimeClasspath }
            into('bin') { from 'src/nnueCandidate/bin'; filePermissions { unix('rwxr-xr-x') } }
            from(rootProject.file('docs/nnue-botli-candidate.md')) { rename { 'README.md' } }
            from(rootProject.file('build-assets/nnue-candidate/manifest.json')) { rename { 'network-manifest.json' } }
            into('validation') { from rootProject.file('tools/verify_nnue_candidate.py') }
        }
    }
}
tasks.withType(Test).configureEach {
    if (project.hasProperty('conventionalVectorTests')) jvmArgs '--add-modules=jdk.incubator.vector'
}
