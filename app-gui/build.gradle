plugins {
    id 'java'
}
apply from: rootProject.file('gradle/java-conventions.gradle')

description = 'SeedV6 desktop Play, Network Training, Arena, preferences and Swing launcher.'
dependencies {
    implementation project(':engine-core')
    implementation project(':engine-training')
    implementation 'com.formdev:flatlaf:3.7'
    implementation 'net.java.dev.jna:jna-platform:5.17.0'
}

// Keep the established unqualified `run --args=gui` route in :app. Native
// legacy distribution assembly stays there until WU8; this route needs no legacy app.
tasks.register('runGui', JavaExec) {
    group = 'application'
    description = 'Launches the desktop directly from app-gui and its shared services.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.gui.SwingLauncher'
    jvmArgs '--add-modules=jdk.incubator.vector'
}

tasks.register('brnSuccessorWave', JavaExec) {
    group = 'verification'
    description = 'Inspects or explicitly prepares the BRN successor GUI training wave without training.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.gui.BrnSuccessorWave'
    jvmArgs '--add-modules=jdk.incubator.vector', '-Xmx768m', '-Djava.awt.headless=true'
    if (project.hasProperty('waveReport')) args '--create', rootProject.file(project.property('waveReport')).absolutePath
    else args '--inspect'
}
tasks.register('brnResidualWave', JavaExec) {
    group = 'verification'
    description = 'Prepares the explicit Gen32 residual wave and continued-BRE control, without training.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.gui.BrnResidualWave'
    jvmArgs '--add-modules=jdk.incubator.vector', '-Xmx768m', '-Djava.awt.headless=true'
    if (project.hasProperty('residualWaveReport')) args '--create', rootProject.file(project.property('residualWaveReport')).absolutePath
    else doFirst { throw new GradleException('Supply -PresidualWaveReport=<new report path>') }
}

tasks.register('brnContinuationWave', JavaExec) {
    group = 'verification'
    description = 'Prepares explicitly planned exact-state BRN continuation lineages without training.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.gui.BrnContinuationWave'
    jvmArgs '--add-modules=jdk.incubator.vector', '-Xmx768m', '-XX:ActiveProcessorCount=1', '-Djava.awt.headless=true'
    if (project.hasProperty('continuationWavePlan') && project.hasProperty('continuationWaveReport'))
        args '--create', rootProject.file(project.property('continuationWavePlan')).absolutePath,
                rootProject.file(project.property('continuationWaveReport')).absolutePath
    else doFirst { throw new GradleException('Supply continuationWavePlan and continuationWaveReport') }
}

tasks.withType(Test).configureEach {
    if (project.hasProperty('conventionalVectorTests')) jvmArgs '--add-modules=jdk.incubator.vector'
    if (project.hasProperty('headless')) systemProperty 'java.awt.headless', 'true'
    if (project.hasProperty('waveGuiReport')) systemProperty 'seedv6.waveGuiReport', rootProject.file(project.property('waveGuiReport')).absolutePath
    if (project.hasProperty('residualWaveGuiReport')) systemProperty 'seedv6.residualWaveGuiReport', rootProject.file(project.property('residualWaveGuiReport')).absolutePath
    if (project.hasProperty('continuationWaveGuiReport')) systemProperty 'seedv6.continuationWaveGuiReport', rootProject.file(project.property('continuationWaveGuiReport')).absolutePath
    if (project.hasProperty('compactWaveGuiReport')) systemProperty 'seedv6.compactWaveGuiReport', rootProject.file(project.property('compactWaveGuiReport')).absolutePath
    if (project.hasProperty('degreeControlWaveGuiReport')) systemProperty 'seedv6.degreeControlWaveGuiReport', rootProject.file(project.property('degreeControlWaveGuiReport')).absolutePath
    maxHeapSize = '2g'
}

tasks.register('brnCompactContinuationWave', JavaExec) {
    group = 'verification'
    description = 'Prepares the explicit compact-cubic continuation and mature controls without training.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.gui.BrnCompactContinuationWave'
    jvmArgs '--add-modules=jdk.incubator.vector', '-Xmx768m', '-XX:ActiveProcessorCount=1', '-Djava.awt.headless=true'
    if (project.hasProperty('compactWavePlan') && project.hasProperty('compactWaveReport'))
        args '--create', rootProject.file(project.property('compactWavePlan')).absolutePath,
                rootProject.file(project.property('compactWaveReport')).absolutePath
    else doFirst { throw new GradleException('Supply compactWavePlan and compactWaveReport') }
}

tasks.register('brnDegreeControlWave', JavaExec) {
    group = 'verification'
    description = 'Prepares explicitly bound quadratic/cubic continuation controls without training.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.gui.BrnDegreeControlWave'
    jvmArgs '--add-modules=jdk.incubator.vector', '-Xmx768m', '-XX:ActiveProcessorCount=1', '-Djava.awt.headless=true'
    if (project.hasProperty('degreeControlWavePlan') && project.hasProperty('degreeControlWaveReport'))
        args '--create', rootProject.file(project.property('degreeControlWavePlan')).absolutePath,
                rootProject.file(project.property('degreeControlWaveReport')).absolutePath
    else doFirst { throw new GradleException('Supply degreeControlWavePlan and degreeControlWaveReport') }
}
