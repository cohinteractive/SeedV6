plugins { id 'java-library' }
apply from: rootProject.file('gradle/java-conventions.gradle')

description = 'Independent references, research implementations, empirical runners and diagnostic resources.'
// Optional vector experiment remains research-only; core/UCI acquire no module dependency.
tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['--add-modules', 'jdk.incubator.vector'] }
dependencies {
    implementation project(':engine-core')
    implementation project(':engine-training')
    implementation 'com.google.code.gson:gson:2.11.0'
}
tasks.withType(JavaExec).configureEach {
    workingDir rootProject.projectDir
    jvmArgs '--add-modules=jdk.incubator.vector', '-Djava.awt.headless=true'
}
tasks.withType(Test).configureEach {
    jvmArgs '--add-modules=jdk.incubator.vector'
    systemProperty 'java.awt.headless', 'true'
    maxHeapSize = '2g'
    if (project.hasProperty('brnScalar')) systemProperty 'seedv6.brn3.scalar', 'true'
}
tasks.named('test') { useJUnitPlatform { excludeTags 'slow-nnue' } }
tasks.register('nnueSlowTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'slow-nnue' }
}
// Research-only runtime export for Python launchers; no app/GUI/UCI artifacts.
tasks.register('p3InformationBaseline', JavaExec) {
    group = 'verification'
    description = 'Observation-neutral cumulative Phase 3 TT/history baseline; bounded diagnostics only.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.search.exact.P3InformationBaseline'
    jvmArgs '-Xms128m', '-Xmx512m', '-XX:ActiveProcessorCount=1'
    if (project.hasProperty('researchArgs')) args project.property('researchArgs').toString().trim().split(/\s+/)
}
tasks.register('p3HistoryStudy', JavaExec) {
    group = 'verification'
    description = 'Bounded cumulative O2 diagnostics and warmed request costs.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.search.exact.P3HistoryStudy'
    jvmArgs '-Xms256m', '-Xmx768m', '-XX:ActiveProcessorCount=1'
    if (project.hasProperty('researchArgs')) args project.property('researchArgs').toString().trim().split(/\s+/)
}
tasks.register('installResearch', Sync) {
    into layout.buildDirectory.dir('install/research')
    into('lib') { from tasks.named('jar'); from configurations.runtimeClasspath }
}

tasks.register('brnSuccessorProbe', JavaExec) {
    group = 'verification'
    description = 'Bounded BRN successor Gen0 inference feasibility and frozen checkpoint verification; no training.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.eval.BrnSuccessorProbe'
    jvmArgs '-Xmx768m', '-XX:ActiveProcessorCount=1'
    args rootProject.file('build-assets/production/bre-pair2-g32.brn-pair2').absolutePath
    if (project.hasProperty('baselineLineage')) args project.property('baselineLineage')
    if (project.hasProperty('probeReport')) args rootProject.file(project.property('probeReport')).absolutePath
}

tasks.register('brnDiagnostic', JavaExec) {
    group = 'verification'
    description = 'Isolated cross-host BRN replay and production training diagnostics (no GUI).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.search.BrnDiagnostic'
    workingDir rootProject.projectDir
    jvmArgs '-Djava.awt.headless=true', '-Xms256m', '-Xmx1024m'
    if (project.hasProperty('diagnosticArgs')) args project.property('diagnosticArgs').toString().trim().split(/\s+/)
    // Paths and FENs with spaces remain one argument.
    if (project.hasProperty('diagnosticFen')) args "--fen=${project.property('diagnosticFen')}"
    if (project.hasProperty('diagnosticFenFile')) args "--fen-file=${project.property('diagnosticFenFile')}"
    if (project.hasProperty('diagnosticModel')) args "--model=${project.property('diagnosticModel')}"
    if (project.hasProperty('diagnosticOutput')) args "--output=${project.property('diagnosticOutput')}"
    if (project.hasProperty('diagnosticStartFen')) args "--starting-fen=${project.property('diagnosticStartFen')}"
}

