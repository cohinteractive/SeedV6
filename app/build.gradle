 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/8.11.1/userguide/building_java_projects.html in the Gradle documentation.
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    // Desktop presentation only; UCI and engine code do not initialize Swing.
    implementation 'com.formdev:flatlaf:3.7'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.ohinteractive.seedv6.Main'
    applicationName = 'seedv6'
}

tasks.named('startScripts') {
    doLast {
        // A UCI launcher's stdout cannot depend on an ambient DEBUG variable.
        windowsScript.text = windowsScript.text.replace(
            '@if "%DEBUG%"=="" @echo off',
            '@echo off'
        )
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform {
        excludeTags 'slow-nnue'
    }
    dependsOn tasks.named('installDist')
    systemProperty 'seedv6.windowsLauncher', layout.buildDirectory.file(
        'install/seedv6/bin/seedv6.bat'
    ).get().asFile.absolutePath
}

tasks.register('nnueSlowTest', Test) {
    group = 'verification'
    description = 'Runs expensive NNUE persistence, training lifecycle and GUI integration tests.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)

    useJUnitPlatform {
        includeTags 'slow-nnue'
    }

    filter {
        includeTestsMatching '*'
        failOnNoMatchingTests = true
    }
    ignoreFailures = false
    mustRunAfter tasks.named('test')
}

tasks.register('fullCheck') {
    group = 'verification'
    description = 'Runs routine checks and the explicit slow NNUE test suite.'
    dependsOn tasks.named('check'), tasks.named('nnueSlowTest')
}

tasks.register('searchBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the deterministic single-thread WS12 search benchmark.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.search.SearchBenchmark'
    if(project.hasProperty('benchmarkArgs')) {
        args project.property('benchmarkArgs').toString().trim().split(/\s+/)
    }
}

tasks.register('evaluatorBenchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the OPT5 evaluator-only benchmark over prebuilt corpus boards.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.eval.EvaluatorBenchmark'
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:+AlwaysPreTouch', '-Xbatch'
    if(project.hasProperty('benchmarkArgs')) {
        args project.property('benchmarkArgs').toString().trim().split(/\s+/)
    }
}

tasks.register('nnuePerformanceBenchmark', JavaExec) {
    group = 'verification'
    description = 'Warmed Workstream I inference, transition and fixed-depth search measurements.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.nnue.NnuePerformanceBenchmark'
    workingDir rootProject.projectDir
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:+AlwaysPreTouch', '-Xbatch'
    if(project.hasProperty('benchmarkArgs')) {
        args project.property('benchmarkArgs').toString().trim().split(/\s+/)
    }
}

tasks.register('nnueResearch', JavaExec) {
    group = 'verification'
    description = 'Explicit-path bounded strength, health, progression, campaign and endurance research.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.nnue.research.ResearchTool'
    workingDir rootProject.projectDir
    jvmArgs '-Xms256m', '-Xmx1536m'
    if (project.hasProperty('researchArgs')) {
        args project.property('researchArgs').toString().trim().split(/\s+/)
    }
}

tasks.register('brnRemediationBenchmark', JavaExec) {
    group = 'verification'
    description = 'Bounded depth-4 neural search and warmed evaluator comparison (no timing assertions).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.search.BrnRemediationBenchmark'
    jvmArgs '-Xms512m', '-Xmx512m', '-XX:+AlwaysPreTouch', '-Xbatch'
    if (project.hasProperty('benchmarkArgs')) {
        args project.property('benchmarkArgs').toString().trim().split(/\s+/)
    }
}

tasks.register('brnBootstrapSmoke', JavaExec) {
    group = 'verification'
    description = 'Two bounded NNUE-driven bootstrap generations per BRN family, with separate phase timings.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.search.BrnBootstrapSmoke'
    workingDir rootProject.projectDir
    jvmArgs '-Xms512m', '-Xmx1024m'
    if (project.hasProperty('bootstrapSmokeRoot')) args project.property('bootstrapSmokeRoot')
    if (project.hasProperty('bootstrapGenerator')) args project.property('bootstrapGenerator')
}

tasks.register('brn2Diagnostics', JavaExec) {
    group = 'verification'
    description = 'Deterministic BRN-2 score, local volatility and bounded search diagnostics (JSON Lines).'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.tools.search.Brn2Diagnostics'
    workingDir rootProject.projectDir
    jvmArgs '-Xms256m', '-Xmx1024m'
    // Paths stay single arguments, including spaces. General numeric flags follow tool convention.
    if (project.hasProperty('brn2Checkpoint')) args "--brn2=${project.property('brn2Checkpoint')}"
    if (project.hasProperty('nnueCheckpoint')) args "--nnue=${project.property('nnueCheckpoint')}"
    if (project.hasProperty('diagnosticOutput')) args "--output=${project.property('diagnosticOutput')}"
    if (project.hasProperty('diagnosticArgs')) args project.property('diagnosticArgs').toString().trim().split(/\s+/)
}
