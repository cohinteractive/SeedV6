plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

apply from: rootProject.file('gradle/java-conventions.gradle')

dependencies {
    implementation project(':engine-core')
    implementation project(':engine-training')
    // Transitional composition only: Main delegates desktop startup to its owner.
    implementation project(':app-gui')
    implementation project(':app-uci')
    testImplementation gradleTestKit()
    // Independent JSON parser for diagnostic report contract tests.
    testImplementation 'com.google.code.gson:gson:2.11.0'

    // This dependency is used by the application.
    implementation libs.guava
    // Mixed integration tests remain here; desktop runtime libraries belong to app-gui.
    testImplementation 'com.formdev:flatlaf:3.7'
    testImplementation 'net.java.dev.jna:jna-platform:5.17.0'
    // Remaining ordinary integration tests use these APIs directly.
    // Production corpus/runtime dependencies are owned by engine-training.
    testImplementation 'com.github.luben:zstd-jni:1.5.7-20'
    testImplementation 'org.xerial:sqlite-jdbc:3.53.4.0'
}

application {
    // Define the main class for the application.
    mainClass = 'com.ohinteractive.seedv6.Main'
    applicationName = 'seedv6'
}

// Retain the historical task name; the shared identity has one resource owner.
tasks.register('generateApplicationVersion') {
    dependsOn ':engine-core:generateApplicationVersion'
}

// BRN-3 uses lane-wise binary64 kernels; direct launches without the optional
// module retain its scalar implementation. No other architecture selects them.
tasks.withType(JavaExec).configureEach {
    jvmArgs '--add-modules=jdk.incubator.vector'
}
tasks.withType(Test).configureEach {
    jvmArgs '--add-modules=jdk.incubator.vector'
    if (project.hasProperty('brnScalar')) systemProperty 'seedv6.brn3.scalar', 'true'
}

tasks.register('corpus', JavaExec) {
    group = 'application'
    description = 'Headless external training corpus import, inspection and integrity validation.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.ohinteractive.seedv6.corpus.lichess.CorpusMain'
    jvmArgs '-Djava.awt.headless=true', '-Xmx512m'
    if (project.hasProperty('corpusArgs')) args project.property('corpusArgs').toString().trim().split(/\s+/)
    // Explicit path properties preserve spaces on Windows and other hosts.
    if (project.hasProperty('corpusInput')) args '--input', project.property('corpusInput')
    if (project.hasProperty('corpusRoot')) args '--corpus', project.property('corpusRoot')
}

// Preserve the legacy task entry point; native engine code and resources have one owner.
tasks.register('compileSyzygy') {
    group = 'build'
    description = 'Builds the shared engine optional Syzygy JNI provider.'
    dependsOn ':engine-core:compileSyzygy'
}

tasks.named('startScripts') {
    doLast {
        // A UCI launcher's stdout cannot depend on an ambient DEBUG variable.
        windowsScript.text = windowsScript.text.replace(
            '@if "%DEBUG%"=="" @echo off',
            '@echo off'
        )
        // Resolve the incubator only for the GUI/training launcher. Ordinary UCI
        // startup retains its clean stderr contract (the JDK emits a warning).
        windowsScript.text = windowsScript.text.replaceAll(/(?m)^set DEFAULT_JVM_OPTS=.*$/) { line ->
            line + '\n@if /I "%~1"=="gui" set DEFAULT_JVM_OPTS=%DEFAULT_JVM_OPTS% "--add-modules=jdk.incubator.vector"'
        }
        unixScript.text = unixScript.text.replaceAll(/(?m)^DEFAULT_JVM_OPTS=.*$/) { line ->
            line + '\ncase "$1" in [gG][uU][iI]) DEFAULT_JVM_OPTS="$DEFAULT_JVM_OPTS --add-modules=jdk.incubator.vector" ;; esac'
        }
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform {
        excludeTags 'slow-nnue'
    }
    dependsOn tasks.named('installDist')
    systemProperty 'seedv6.windowsLauncher', layout.buildDirectory.file(
        'install/seedv6/bin/seedv6.bat'
    ).get().asFile.absolutePath
    systemProperty 'seedv6.versionBuildScript', rootProject.file('gradle/application-version.gradle').absolutePath
    systemProperty 'seedv6.versionState', rootProject.file('VERSION_STATE.txt').absolutePath
}

// Launcher tests propagate this property explicitly to their subprocesses without JVM startup noise.
tasks.withType(Test).configureEach {
    if (project.hasProperty('headless')) {
        systemProperty 'java.awt.headless', 'true'
        // Production drivers each own a 192 MiB TT; lifecycle tests can own several at once.
        maxHeapSize = '2g'
    }
}

tasks.register('nnueSlowTest', Test) {
    group = 'verification'
    description = 'Runs expensive NNUE persistence, training lifecycle and GUI integration tests.'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    javaLauncher = javaToolchains.launcherFor(java.toolchain)

    useJUnitPlatform {
        includeTags 'slow-nnue'
    }

    filter {
        includeTestsMatching '*'
        failOnNoMatchingTests = true
    }
    ignoreFailures = false
    mustRunAfter tasks.named('test')
}

tasks.register('fullCheck') {
    group = 'verification'
    description = 'Runs routine checks and the explicit slow NNUE test suite.'
    dependsOn tasks.named('check'), tasks.named('nnueSlowTest'), ':research:check', ':research:nnueSlowTest', ':integrationTest', ':integrationSlowTest'
}

