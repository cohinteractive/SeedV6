/*
 * This file was generated by the Gradle 'init' task.
 *
 * This generated file contains a sample Java application project to get you started.
 * For more details on building Java & JVM projects, please refer to https://docs.gradle.org/8.11.1/userguide/building_java_projects.html in the Gradle documentation.
 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.ohinteractive.seedv6.Main'
    applicationName = 'seedv6'
}

tasks.named('startScripts') {
    doLast {
        // A UCI launcher's stdout cannot depend on an ambient DEBUG variable.
        windowsScript.text = windowsScript.text.replace(
            '@if "%DEBUG%"=="" @echo off',
            '@echo off'
        )
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
    dependsOn tasks.named('installDist')
    systemProperty 'seedv6.windowsLauncher', layout.buildDirectory.file(
        'install/seedv6/bin/seedv6.bat'
    ).get().asFile.absolutePath
}
